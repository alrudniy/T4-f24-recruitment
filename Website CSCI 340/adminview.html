<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="Family_Promise.png" alt="Family Promise Logo">
            <h1>Admin Dashboard</h1>
        </header>

        <section class="upload-section">
            <h2>Upload Homepage Images</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*" required>
                <button type="submit">Upload</button>
            </form>
            <p>Uploaded images will be displayed on the homepage.</p>
        </section>

        <section class="users-section">
            <h2>View Users</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- User rows will be dynamically added here -->
                </tbody>
            </table>
        </section>

        <section class="quiz-results-section">
            <h2>Quiz Results</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Score</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Quiz results rows will be dynamically added here -->
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
