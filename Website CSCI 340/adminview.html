<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="Family_Promise.png" alt="Family Promise Logo" style="float: left; height: 50px;">
            <h1>Admin Dashboard</h1>
        </header>

        <section class="upload-section">
            <h2>Upload Homepage Images</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/jpeg, image/png, image/gif" multiple required id="imageInput">
                <p>Upload JPEG, PNG, or GIF images. Multiple images can be selected.</p>
                <div id="imagePreviewContainer"></div> <button type="submit">Upload</button>
            </form>
        </section>

        <section class="users-section">
            <h2>View Users</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- User rows will be dynamically added here -->
                </tbody>
            </table>
        </section>

        <section class="quiz-results-section">
            <h2>Quiz Results</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Score</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Quiz results rows will be dynamically added here -->
                </tbody>
            </table>
        </section>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.createElement('div'); // Container for previews
        imagePreviewContainer.id = 'imagePreviewContainer';
        imageInput.parentNode.insertBefore(imagePreviewContainer, imageInput.nextSibling);

        imageInput.addEventListener('change', function() {
            imagePreviewContainer.innerHTML = ''; // Clear previous previews
            const files = this.files;
            if (files) {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const reader = new FileReader();

                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.maxWidth = '200px';
                        img.style.maxHeight = '200px';
                        img.style.marginRight = '10px'; // Add some spacing
                        imagePreviewContainer.appendChild(img);
                    }

                    reader.readAsDataURL(file);
                }
            }
        });
    </script>
</body>
</html>
