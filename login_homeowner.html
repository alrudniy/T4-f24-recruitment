<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homeowner Verification</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Homeowner Verification</h1>
    <form id="verificationForm">
      <label for="contact">Email or Phone Number:</label>
      <input type="text" id="contact" name="contact" required aria-label="Email or Phone Number"><br>

      <button type="button" onclick="sendVerificationCode()">Send Verification Code</button><br>

      <label for="code">Verification Code:</label>
      <input type="text" id="code" name="code" aria-label="Verification Code"><br>

      <button type="button" onclick="verifyCode()">Verify Code</button>
    </form>
  </div>
  <script>
    async function sendVerificationCode() {
      const contact = document.getElementById('contact').value;

      try {
        const response = await fetch('http://localhost:3000/send-verification', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ contact })
        });

        const data = await response.json();
        if (data.status === 'success') {
          alert('Verification code sent to your contact.');
        } else {
          alert('Error sending verification code.');
        }
      } catch (error) {
        console.error('Error sending verification code:', error);
      }
    }

    async function verifyCode() {
      const contact = document.getElementById('contact').value;
      const code = document.getElementById('code').value;

      try {
        const response = await fetch('http://localhost:3000/verify-code', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ contact, code })
        });

        const data = await response.json();
        if (data.status === 'approved') {
          alert('Verification successful');
          // Redirect to another page or allow access to protected content
        } else {
          alert('Invalid verification code');
        }
      } catch (error) {
        console.error('Error verifying code:', error);
      }
    }
  </script>
</body>
</html>
